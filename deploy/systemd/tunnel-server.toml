# RSTunnel Server 配置（systemd 部署，安装到 /etc/tunnel/server.toml）。
# 端口映射见 docs §48：443 TCP = HTTPS/Web/API/HTTP 隧道，443 UDP = QUIC。

[http]
bind = "0.0.0.0:80"          # 明文 HTTP 隧道入口（生产可由反向代理转发/重定向）

[https]
bind = "0.0.0.0:443"         # TLS 终止入口（按 SNI 选证书；T-27）

[quic]
bind = "0.0.0.0:443"         # UDP，Agent QUIC 隧道（与上方 TCP 443 不冲突）
max_concurrent_bidi_streams = 10000
max_concurrent_uni_streams = 1000
idle_timeout_seconds = 60

[internal]
bind = "127.0.0.1:8080"      # 回环：/metrics /health /ready /api（不对外发布）

[database]
url = "sqlite:///var/lib/tunnel-server/tunnel.db"

[logging]
level = "info"

[security]
max_login_attempts = 5
login_window_seconds = 300
allow_unsafe_targets = false

# 自签名证书参数（开发/单机演示）。生产由 T-27 从 ACME/配置加载正式证书。
# `subjects` 须包含 Agent 所连主机名；`cert_der_path` 落盘 DER 供 Agent 信任。
# 同时配置 cert_der_path + key_der_path 后，服务端复用已落盘证书（跨重启稳定身份）。
[tls]
subjects = ["tunnel.example.com"]
# cert_der_path = "/var/lib/tunnel-server/server.der"
# key_der_path  = "/var/lib/tunnel-server/server.key.der"
