# RSTunnel 演示拓扑（§142：server + agent + target + client）。
#
#   用法（仓库根目录）：
#     docker compose -f deploy/docker/docker-compose.yml up --build
#   走通验证（HTTP 隧道按 Host 路由到 target）：
#     curl -H "Host: app.example.com" http://localhost:8080/
#   管理面（回环）：
#     Web 管理后台：浏览器打开 http://127.0.0.1:8080/
#     curl http://127.0.0.1:8080/health
#     curl http://127.0.0.1:8080/ready
#     curl http://127.0.0.1:8080/metrics
#
# 说明：`init` 一次性服务用同一 server 镜像跑 `tunnel-cli seed`，向共享卷中的 SQLite
# 种入 Node + 凭据（SHA-256 哈希）+ HTTP Route；幂等（demo-node 已存在即跳过）。
# server 落盘自签名证书 DER 到共享卷 `certs`，agent 以该证书为信任锚建立 QUIC 连接。

services:
  init:
    image: rstunnel-server:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    entrypoint: ["tunnel-cli"]
    command:
      - "seed"
      - "--db"
      - "sqlite:///data/tunnel.db"
      - "--token"
      - "rstunnel-demo-token"          # 演示用；与 config/agent.toml 保持一致
      - "--target-host"
      - "target"
      - "--target-port"
      - "5678"
      - "--hostname"
      - "app.example.com"
    volumes:
      - data:/data
    restart: "no"

  server:
    image: rstunnel-server:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - data:/data
      - certs:/etc/tunnel/certs
      - ./config/server.toml:/etc/tunnel/server.toml:ro
    ports:
      - "8080:80"                     # HTTP 隧道入口
      - "8443:443/tcp"                # HTTPS TLS 入口（演示无证书）
      - "8443:443/udp"                # QUIC（外部 agent 连接）
      - "127.0.0.1:8080:8080"         # 回环 internal（/metrics /health /ready /api）
    cap_add:
      - NET_BIND_SERVICE              # 非 root 绑定 80/443（§48 非 root）
    healthcheck:
      # server 启动时把自签名证书 DER 写入共享卷；文件就绪后 agent 才可连接。
      test: ["CMD", "test", "-f", "/etc/tunnel/certs/server.der"]
      interval: 2s
      timeout: 2s
      retries: 60
    restart: unless-stopped

  agent:
    image: rstunnel-agent:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - certs:/etc/tunnel/certs
      - ./config/agent.toml:/etc/tunnel/agent.toml:ro
    restart: unless-stopped

  target:
    image: hashicorp/http-echo
    command: ["-text", "hello from target", "-listen", ":5678"]
    restart: unless-stopped

volumes:
  data:
  certs:
