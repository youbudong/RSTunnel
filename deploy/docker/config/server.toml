# RSTunnel 演示配置（Docker compose）。生产请按 docs §44 调整，并用 ACME 证书（T-27）替代自签名。
# 端口映射见 §48：443 TCP = HTTPS/Web/API/HTTP 隧道，443 UDP = QUIC。

[http]
bind = "0.0.0.0:80"          # HTTP 隧道入口（compose 映射 host 8080 -> 容器 80）

[https]
bind = "0.0.0.0:443"         # TLS 终止入口（演示无证书，仅监听；compose 映射 host 8443/tcp）

[quic]
bind = "0.0.0.0:443"         # UDP，Agent QUIC 隧道（与上方 TCP 443 不冲突）
max_concurrent_bidi_streams = 10000
max_concurrent_uni_streams = 1000
idle_timeout_seconds = 60

[internal]
bind = "127.0.0.1:8080"      # 回环：/metrics、/health、/ready、REST API（不对外发布）
web_dir = "/app/web/dist"    # Web 管理后台静态目录（Docker 镜像内由 node 构建并 COPY 进来）

[database]
url = "sqlite:///data/tunnel.db"

[logging]
level = "info"

[security]
max_login_attempts = 5
login_window_seconds = 300
allow_unsafe_targets = false

[tls]
# 自签名证书 SAN：须包含 Agent 所连主机名（compose 服务名 `server`）与 `localhost`。
subjects = ["server", "localhost"]
# 把生成的证书 DER 写入共享卷，供 Agent 以 [server].ca 信任。
cert_der_path = "/etc/tunnel/certs/server.der"
# 与 cert_der_path 一起配置，服务端复用已落盘证书（跨容器重启稳定身份）。
key_der_path = "/etc/tunnel/certs/server.key.der"

[demo]
# 演示引导：启动时若 demo-node 不存在，种入 Node + 运行时凭据 + HTTP Route（幂等）。
# 生产部署删除本节或将 enabled 设为 false（默认）。
enabled = true
token = "rstunnel-demo-token"     # 与 config/agent.toml 的 [auth].token 一致
hostname = "app.example.com"
target_host = "target"            # compose 网络内的目标服务名
target_port = 5678
