[workspace]
resolver = "2"
members = [
    "crates/tunnel-common",
    "crates/tunnel-protocol",
    "crates/tunnel-config",
    "crates/tunnel-auth",
    "crates/tunnel-db",
    "crates/tunnel-metrics",
    "crates/tunnel-core",
    "server",
    "agent",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

# ---- 内部 crate（path 依赖）----
[workspace.dependencies]
tunnel-common = { path = "crates/tunnel-common" }
tunnel-protocol = { path = "crates/tunnel-protocol" }
tunnel-config = { path = "crates/tunnel-config" }
tunnel-auth = { path = "crates/tunnel-auth" }
tunnel-db = { path = "crates/tunnel-db" }
tunnel-metrics = { path = "crates/tunnel-metrics" }
tunnel-core = { path = "crates/tunnel-core" }

# ---- 外部依赖（版本在 workspace 统一）----
# async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# 配置快照导入/导出（T-42，§100）用 YAML。serde_yaml 已归档，若 T-45 audit 告警再换维护中的 fork。
serde_yaml = "0.9"

# transport / tls / http（server 数据面后续启用）
quinn = { version = "0.11", default-features = false, features = ["rustls", "runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
x509-parser = "0.17"
rcgen = "0.13"
axum = { version = "0.7", features = ["ws"] }
hyper = { version = "1", features = ["full"] }
httparse = "1"
utoipa = { version = "4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }

# database（v1 默认 SQLite；PostgreSQL 在 HA 里程碑启用）
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

# crypto
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
prometheus = "0.13"

# ids / time / bytes
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "macros", "parsing"] }
bytes = "1"

# error handling / misc
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
dashmap = "6"
arc-swap = "1"
clap = { version = "4", features = ["derive"] }

# 全局 lint 约定
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
