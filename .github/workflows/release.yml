# Release（T-45/§125）：tag（v*）触发，产出三平台三二进制产物 + Docker 多架构镜像。
# 产物：tunnel-server / tunnel-agent / tunnel-cli；镜像：ghcr.io/<owner>/tunnel-{server,agent}。

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  artifacts:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} -p tunnel-server -p tunnel-agent -p tunnel-cli

      - name: Install cross (aarch64-linux only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build via cross (aarch64-linux only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }} -p tunnel-server -p tunnel-agent -p tunnel-cli

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          for bin in tunnel-server tunnel-agent tunnel-cli; do
            cp "target/${{ matrix.target }}/release/$bin" "dist/$bin"
          done
          tar -czf "rstunnel-${{ matrix.target }}.tar.gz" -C dist .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          foreach ($bin in @("tunnel-server", "tunnel-agent", "tunnel-cli")) {
            Copy-Item "target/${{ matrix.target }}/release/$bin.exe" "dist/$bin.exe"
          }
          Compress-Archive -Path "dist/*" -DestinationPath "rstunnel-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            rstunnel-*.tar.gz
            rstunnel-*.zip
          if-no-files-found: error

  docker:
    name: docker (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tunnel-server
            dockerfile: deploy/docker/Dockerfile.server
          - image: tunnel-agent
            dockerfile: deploy/docker/Dockerfile.agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr 镜像名须全小写；GitHub owner 名默认为小写。
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: artifacts
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
