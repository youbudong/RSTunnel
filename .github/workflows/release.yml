# Release（T-45/§125）：tag（v*）触发，产出三平台两二进制产物 + Docker 多架构镜像。
# 产物：tunnel-server / tunnel-agent；镜像：ghcr.io/<owner>/tunnel-{server,agent}。
# 构建提速：amd64 镜像用 cargo 缓存挂载 + gha 缓存（依赖只编译一次）；arm64 镜像复用
# `cross` 交叉编译的二进制组装（rustc 以 amd64 运行，无 QEMU 仿真下的 Rust 编译），
# 最后用 `imagetools create` 合成多架构 manifest。

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  artifacts:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build (native)
        run: cargo build --release --target ${{ matrix.target }} -p tunnel-server -p tunnel-agent

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          for bin in tunnel-server tunnel-agent; do
            cp "target/${{ matrix.target }}/release/$bin" "dist/$bin"
          done
          tar -czf "rstunnel-${{ matrix.target }}.tar.gz" -C dist .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          foreach ($bin in @("tunnel-server", "tunnel-agent")) {
            Copy-Item "target/${{ matrix.target }}/release/$bin.exe" "dist/$bin.exe"
          }
          Compress-Archive -Path "dist/*" -DestinationPath "rstunnel-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            rstunnel-*.tar.gz
            rstunnel-*.zip
          if-no-files-found: error

  # aarch64-linux 独立 job：`cross` 原生交叉编译（rustc 以 amd64 运行，无 QEMU），
  # 产物同时打包 tarball（发布用）与原始二进制（Docker arm64 组装用）。
  binaries-aarch64:
    name: build (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build via cross
        run: cross build --release --target aarch64-unknown-linux-gnu -p tunnel-server -p tunnel-agent
      - name: Package tarball
        run: |
          mkdir -p dist
          for bin in tunnel-server tunnel-agent; do
            cp "target/aarch64-unknown-linux-gnu/release/$bin" "dist/$bin"
          done
          tar -czf "rstunnel-aarch64-unknown-linux-gnu.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-aarch64-unknown-linux-gnu
          path: rstunnel-aarch64-unknown-linux-gnu.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-linux-binaries
          path: |
            target/aarch64-unknown-linux-gnu/release/tunnel-server
            target/aarch64-unknown-linux-gnu/release/tunnel-agent
          if-no-files-found: error

  # Web 管理后台静态资源：原生构建一次，供 arm64 server 镜像组装（避免 QEMU 下跑 node）。
  web:
    name: web (dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  # amd64 镜像：仍在 `rust:1.88-slim-bookworm` 内编译（保证与 bookworm runtime 的 glibc 一致），
  # 靠 cargo 缓存挂载 + gha 缓存让依赖只编译一次。
  docker-amd64:
    name: docker amd64 (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tunnel-server
            dockerfile: deploy/docker/Dockerfile.server
          - image: tunnel-agent
            dockerfile: deploy/docker/Dockerfile.agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest-amd64

  # arm64 镜像：复用 `cross` 交叉编译的二进制 + 预构建 web，组装 runtime 镜像，无 Rust 编译。
  docker-arm64:
    name: docker arm64 (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tunnel-server
            runtime: deploy/docker/Dockerfile.server.runtime
            with_web: true
          - image: tunnel-agent
            runtime: deploy/docker/Dockerfile.agent.runtime
            with_web: false
    runs-on: ubuntu-latest
    needs: [binaries-aarch64, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: aarch64-linux-binaries
          path: arm64-bin
      - uses: actions/download-artifact@v4
        if: matrix.with_web
        with:
          name: web-dist
          path: webdist
      # upload-artifact@v4 对多文件以「最小公共祖先」为根、单目录展平到根，
      # 下载后的落盘路径不可预知，故用 find 定位二进制/静态资源，避免硬编码层级。
      - name: Stage arm64 context
        run: |
          mkdir -p ctx
          for bin in tunnel-server tunnel-agent; do
            f="$(find arm64-bin -type f -name "$bin" | head -n1)"
            [ -n "$f" ] || { echo "ERROR: $bin not found under arm64-bin"; exit 1; }
            cp "$f" "ctx/$bin"
          done
          if [ "${{ matrix.with_web }}" = "true" ]; then
            idx="$(find webdist -type f -name index.html | head -n1)"
            [ -n "$idx" ] || { echo "ERROR: web index.html not found under webdist"; exit 1; }
            mkdir -p ctx/dist
            cp -r "$(dirname "$idx")/." ctx/dist/
          fi

      - uses: docker/build-push-action@v6
        with:
          context: ./ctx
          file: ${{ matrix.runtime }}
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest-arm64

  # 合成多架构 manifest：`latest` 与 `ref_name` 指向 amd64 + arm64 两个平台。
  docker-merge:
    name: docker merge
    runs-on: ubuntu-latest
    needs: [docker-amd64, docker-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge multi-arch manifests
        run: |
          for img in tunnel-server tunnel-agent; do
            docker buildx imagetools create \
              -t "ghcr.io/${{ github.repository_owner }}/${img}:latest" \
              -t "ghcr.io/${{ github.repository_owner }}/${img}:${{ github.ref_name }}" \
              "ghcr.io/${{ github.repository_owner }}/${img}:latest-amd64" \
              "ghcr.io/${{ github.repository_owner }}/${img}:latest-arm64"
          done

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: [artifacts, binaries-aarch64]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
